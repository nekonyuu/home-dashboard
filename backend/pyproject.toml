[project]
name = "pac-dashboard"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.22.1",
    "fastapi>=0.146.0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# Règle de dépendance (PLAN.md §3.5) : vérifiée par tests/architecture.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Couches : adaptateurs -> application -> domaine"
type = "layers"
layers = ["app.adapters", "app.application", "app.domain"]

[[tool.importlinter.contracts]]
name = "Le domaine n'importe que la bibliothèque standard"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["aiohttp", "aiosqlite", "fastapi", "pydantic", "yaml", "uvicorn", "starlette"]

[[tool.importlinter.contracts]]
name = "L'application n'importe que le domaine"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.adapters", "aiohttp", "aiosqlite", "fastapi", "pydantic", "yaml", "uvicorn", "starlette"]

[[tool.importlinter.contracts]]
name = "Seuls adapters.outbound.magellan et thinq parlent HTTP aux fournisseurs"
type = "forbidden"
source_modules = ["app.domain", "app.application", "app.adapters.inbound", "app.adapters.outbound.sqlite", "app.adapters.outbound.fake"]
forbidden_modules = ["aiohttp"]
# La CLI passe par la racine de composition (app.main), seul point d'assemblage autorisé.
ignore_imports = ["app.adapters.inbound.cli -> app.main"]

[[tool.importlinter.contracts]]
name = "Seul adapters.outbound.sqlite touche SQLite"
type = "forbidden"
source_modules = ["app.domain", "app.application", "app.adapters.inbound", "app.adapters.outbound.magellan", "app.adapters.outbound.thinq", "app.adapters.outbound.fake"]
forbidden_modules = ["aiosqlite", "sqlite3"]
# La CLI passe par la racine de composition (app.main), seul point d'assemblage autorisé.
ignore_imports = ["app.adapters.inbound.cli -> app.main"]

[[tool.importlinter.contracts]]
name = "Seul adapters.inbound.http importe FastAPI"
type = "forbidden"
source_modules = ["app.domain", "app.application", "app.adapters.outbound"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Les adaptateurs fournisseurs sont indépendants les uns des autres"
type = "independence"
modules = ["app.adapters.outbound.magellan", "app.adapters.outbound.thinq"]
